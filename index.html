<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FF6600"><meta name="apple-mobile-web-app-title" content="PrixMalin"><title>PrixMalin</title>
<style>
:root{--bg:#F6F7FB;--c:#fff;--t:#111827;--t2:#6B7280;--p:#FF6600;--g:#16A34A;--r:#DC2626;--o:#D97706;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1020;--c:#171E33;--t:#F3F4F6;--t2:#9CA3AF}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"SF Pro Display",sans-serif}
body{background:var(--bg);color:var(--t);padding:calc(var(--st) + 10px) 14px calc(92px + var(--sb))}
h1{font-size:24px;font-weight:900;color:var(--p)}h1 small{display:block;font-size:12px;color:var(--t2);font-weight:600}
.card{background:var(--c);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.btn{display:block;width:100%;text-align:center;background:var(--p);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;margin-top:8px}
.btn.g{background:#94A3B833;color:var(--t)}.btn.d{background:var(--r)}.btn.ok{background:var(--g)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row>*{flex:1}.row .btn{margin:0}
input,select{width:100%;background:var(--bg);color:var(--t);border:1px solid #94A3B844;border-radius:12px;padding:12px;font-size:16px;outline:none}
label.f{font-size:12px;color:var(--t2);font-weight:700;display:block;margin:10px 0 4px}
.chip{display:inline-block;padding:8px 13px;border-radius:20px;font-weight:800;font-size:13px;margin:3px 4px 3px 0;border:2px solid transparent;background:#94A3B826;color:var(--t)}
.v{padding:10px 12px;border-radius:12px;margin-top:8px;font-size:14px;font-weight:600;line-height:1.4}
.v.good{background:#16A34A22}.v.bad{background:#DC262622}.v.warn{background:#D9770622}.v.info{background:#94A3B826}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);display:flex;justify-content:space-around;padding:8px 0 calc(10px + var(--sb));border-top:1px solid #94A3B833;z-index:50}
nav button{background:none;border:none;color:var(--t2);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}nav button b{font-size:22px}nav .on{color:var(--p)}
.ns{display:inline-block;width:26px;height:26px;border-radius:7px;color:#fff;font-weight:900;text-align:center;line-height:26px}
.sm{font-size:12px;color:var(--t2)}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#toast{position:fixed;left:14px;right:14px;top:calc(var(--st) + 12px);background:#111827;color:#fff;padding:13px;border-radius:14px;font-weight:700;font-size:14px;z-index:99;display:none}
</style></head><body>
<h1>PrixMalin<small>Scanne • Vérifie les promos • Compare</small></h1>
<div id="app"></div><div id="toast"></div>
<div id="sc" style="display:none;position:fixed;inset:0;background:#000;z-index:90"><video id="vid" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
<div style="position:absolute;left:6%;right:6%;top:30%;height:26%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.5)"></div>
<div id="hint" style="position:absolute;left:0;right:0;top:60%;text-align:center;color:#fff;font-weight:700;padding:0 20px"></div>
<button class="btn" style="position:absolute;left:20px;right:20px;bottom:calc(30px + var(--sb));width:auto" onclick="stopScan()">✕ Fermer</button></div>
<nav id="nav"></nav>
<script>
const K='prixmalin_v1',ST={Migros:'#FF6600',Lidl:'#0050AA',Coop:'#E4002B',Denner:'#8B0000',Autre:'#6B7280'};
const ALG=[['Lait','milk'],['Gluten','gluten'],['Œufs','eggs'],['Arachides','peanuts'],['Fruits à coque','nuts'],['Soja','soybeans'],['Poisson','fish'],['Sésame','sesame-seeds']];
const PF={none:1,'2for1':.5,'3for2':2/3,half2:.75};
let D={prices:[],prod:{},list:[],rec:[],offers:[],targets:{},bud:0,cards:[],alg:[],key:'',rate:0.94,store:'Migros'},cur=null,tab='scan',stream=null,zr=null,scanning=false;
try{Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const $=i=>document.getElementById(i),save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Mémoire pleine')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500)}
const fmt=n=>(Math.round(n*100)/100).toFixed(2);
function go(t){stopScan();tab=t;$('nav').innerHTML=[['scan','📷','Scanner'],['hist','📈','Historique'],['list','🛒','Liste'],['bud','💰','Budget'],['set','⚙️','Réglages']].map(x=>`<button class="${x[0]===t?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');
  ({scan:rScan,hist:rHist,list:rList,bud:rBud,set:rSet})[t]()}

/* ===== IA ===== */
async function ai(text,o={}){
  if(!D.key){toast('Ajoute ta clé IA dans Réglages');throw 0}
  const content=o.img?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:o.img}},{type:'text',text}]:text;
  const body={model:'claude-sonnet-5-5',max_tokens:o.max||1000,messages:[{role:'user',content}]};
  if(o.search)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':D.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}catch(e){toast('Pas de connexion');throw e}
  if(!r.ok){toast(r.status===401?'Clé IA refusée':'Erreur IA '+r.status);throw r.status}
  const d=await r.json();return d.content.map(c=>c.text||'').join('')}
function compress(f){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7).split(',')[1])};im.onerror=ko;im.src=u})}
async function labelPhoto(inp){
  const f=inp.files[0];if(!f)return;toast('Lecture de l\'étiquette…');
  try{const t=await ai(`Photo d'une étiquette de prix en magasin en Suisse. Réponds UNIQUEMENT en JSON : {"nom":"","marque":"","prix":0,"ancien_prix":0,"promo":"none|2for1|3for2|half2","quantite":0,"unite":"g|kg|ml|l|pc","magasin":"Migros|Lidl|Coop|Denner|Autre"}. Mets 0 si inconnu. promo = type d'offre multi-achat seulement.`,{img:await compress(f)});
    const j=JSON.parse(t.replace(/```json|```/g,'').trim());
    const code='n:'+(j.nom||'produit').toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûù]+/g,'-').slice(0,40);
    D.prod[code]={name:j.nom||'Produit (étiquette)',brand:j.marque||'',alg:[]};cur={code};
    if(ST[j.magasin])D.store=j.magasin;renderProd(j);toast('Étiquette lue ✅ vérifie les valeurs')}catch(e){if(e!==0&&typeof e!=='number')toast('Lecture impossible, saisis à la main')}}
async function webSearch(){
  const p=D.prod[cur.code]||{};$('web').textContent='Recherche en cours…';
  try{$('web').textContent=await ai(`Trouve les prix actuels en Suisse (Migros, Coop, Lidl, Denner, Galaxus, etc.) pour : ${p.name||''} ${p.brand||''} ${p.qty||''}. Réponds en français, 6 lignes max : magasin, prix, date, source. Si tu n'es pas sûr, dis-le clairement.`,{search:true})}catch(e){$('web').textContent='Recherche indisponible.'}}

/* ===== SCAN ===== */
function rScan(){$('app').innerHTML=`<div class="card">
<button class="btn" onclick="startScan()">📷 Scanner un code-barres</button>
<label class="btn g">📸 Photo du code-barres<input type="file" accept="image/*" capture="environment" hidden onchange="codePhoto(this)"></label>
<div class="row"><input id="code" inputmode="numeric" placeholder="Ou tape le code"><button class="btn g" style="flex:0 0 70px" onclick="lookup($('code').value)">OK</button></div>
<label class="btn g">🏷️ Photo de l'étiquette (IA)<input type="file" accept="image/*" capture="environment" hidden onchange="labelPhoto(this)"></label>
<div class="row"><label class="btn g">🧾 Ticket (IA)<input type="file" accept="image/*" capture="environment" hidden onchange="docPhoto(this,'t')"></label><label class="btn g">📰 Prospectus (IA)<input type="file" accept="image/*" capture="environment" hidden onchange="docPhoto(this,'p')"></label></div></div><div id="prod"></div>`;if(cur)renderProd()}
function loadZ(){return new Promise((ok,ko)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function startScan(){stopScan();const v=$('vid');$('sc').style.display='block';$('hint').textContent='Démarrage de la caméra…';
  try{await loadZ();const Z=ZXing,h=new Map();
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);h.set(Z.DecodeHintType.TRY_HARDER,true);
    zr=new Z.BrowserMultiFormatReader(h,250);
    await zr.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},'vid',x=>{if(x)found(x.getText())});
    try{await v.srcObject.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    $('hint').textContent='Place le code-barres dans le cadre, à plat et net';
  }catch(e){const n=e&&e.name||'?';toast(n==='NotAllowedError'?'Caméra refusée : touche aA > Réglages du site web > Caméra > Autoriser, puis recharge.':'Caméra indisponible ('+n+'). Utilise « Photo du code-barres » ou ouvre la page dans Safari.');stopScan()}}
function stopScan(){scanning=false;try{zr&&zr.reset()}catch(e){}zr=null;const sc=$('sc');if(sc)sc.style.display='none';const h=$('hint');if(h)h.textContent=''}
async function codePhoto(inp){const f=inp.files[0];if(!f)return;toast('Lecture du code…');let u;
  try{let code=null;u=URL.createObjectURL(f);
    if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(await createImageBitmap(f));if(r.length)code=r[0].rawValue}catch(e){}}
    if(!code){await loadZ();code=(await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(u)).getText()}
    found(code)}catch(e){toast('Code non lu : photo bien nette et droite, ou tape les chiffres.')}finally{u&&URL.revokeObjectURL(u)}}
function found(c){navigator.vibrate&&navigator.vibrate(60);stopScan();lookup(c)}
async function lookup(c){
  c=String(c||'').replace(/\D/g,'');if(!c)return toast('Code invalide');cur={code:c,op:[]};$('prod').innerHTML='<div class="card">Recherche du produit…</div>';
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,quantity,image_front_small_url,nutriscore_grade,nutriments,allergens_tags,additives_n,product_quantity,product_quantity_unit`);const d=await r.json();
    if(d.status===1){const p=d.product,n=p.nutriments||{};D.prod[c]={name:p.product_name||'Produit sans nom',brand:p.brands||'',img:p.image_front_small_url||'',qty:p.quantity||'',nutri:p.nutriscore_grade||'',sugar:n.sugars_100g,salt:n.salt_100g,add:p.additives_n,alg:(p.allergens_tags||[]).map(a=>a.replace('en:','')),pq:p.product_quantity,pu:p.product_quantity_unit}}
    else{let f=0;for(const h of ['world.openbeautyfacts.org','world.openproductsfacts.org']){try{const d2=await(await fetch(`https://${h}/api/v2/product/${c}.json?fields=product_name,brands,quantity,image_front_small_url`)).json();if(d2.status===1){const p=d2.product;D.prod[c]={name:p.product_name||'Produit',brand:p.brands||'',img:p.image_front_small_url||'',qty:p.quantity||'',alg:[]};f=1;break}}catch(e){}}if(!f&&!D.prod[c])D.prod[c]={name:'Produit inconnu ('+c+')',brand:'',alg:[]}}}catch(e){if(!D.prod[c])D.prod[c]={name:'Produit '+c,brand:'',alg:[]}}
  save();renderProd();
  if(D.auto!==false&&D.key&&!D.prices.some(p=>p.code===c))webSearch();
  try{const r=await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${c}&currency=CHF&order_by=-date&size=10`);const d=await r.json();cur.op=(d.items||[]).map(i=>i.price);analyse()}catch(e){}}
function renderProd(pre){
  pre=pre||{};const p=D.prod[cur.code]||{},ns={a:'#038141',b:'#85BB2F',c:'#FECB02',d:'#EE8100',e:'#E63E11'},bad=(p.alg||[]).filter(a=>D.alg.includes(a));
  const q=pre.quantite||(['g','ml'].includes(p.pu)?p.pq:'')||'';
  $('prod').innerHTML=`<div class="card"><div class="hd"><div><b>${esc(p.name)}</b><div class="sm">${esc(p.brand)} ${esc(p.qty||'')}</div></div>${p.img?`<img src="${esc(p.img)}" style="height:56px;border-radius:10px">`:''}</div>
  ${p.nutri&&ns[p.nutri]?`<span class="ns" style="background:${ns[p.nutri]}">${p.nutri.toUpperCase()}</span> `:''}${p.sugar!=null?`<span class="sm">sucre ${fmt(p.sugar)} g • sel ${fmt(p.salt||0)} g /100 g</span>`:''}${p.add?`<span class="sm"> • ${p.add} additif(s)</span>`:''}
  ${bad.length?`<div class="v bad">⚠️ Contient : ${bad.join(', ')} (ton profil allergies)</div>`:''}
  <label class="f">Magasin</label><div>${Object.keys(ST).map(s=>`<span class="chip" style="${D.store===s?`background:${ST[s]};color:#fff`:''}" onclick="D.store='${s}';save();renderProd(getF())">${s}</span>`).join('')}<span class="chip" onclick="geo()">📍 Auto</span></div>
  <div class="row"><div><label class="f">Prix</label><input id="pr" type="number" step="0.05" inputmode="decimal" value="${pre.prix||''}" oninput="analyse()"></div>
  <div><label class="f">Ancien prix</label><input id="old" type="number" step="0.05" inputmode="decimal" value="${pre.ancien_prix||''}" oninput="analyse()"></div>
  <div><label class="f">Devise</label><select id="cu" onchange="analyse()"><option>CHF</option><option>EUR</option></select></div></div>
  <div class="row"><div><label class="f">Quantité</label><input id="q" type="number" inputmode="decimal" value="${q}" oninput="analyse()"></div>
  <div><label class="f">Unité</label><select id="u" onchange="analyse()">${['g','kg','ml','l','pc'].map(x=>`<option ${x===(pre.unite||p.pu||'g')?'selected':''}>${x}</option>`).join('')}</select></div>
  <div><label class="f">Offre</label><select id="pm" onchange="analyse()">${[['none','Aucune'],['2for1','2 pour 1'],['3for2','3 pour 2'],['half2','2e à −50%']].map(x=>`<option value="${x[0]}" ${x[0]===pre.promo?'selected':''}>${x[1]}</option>`).join('')}</select></div></div>
  <div class="row"><div><label class="f">🎯 Alerte si le prix passe sous (CHF)</label><input id="tg" type="number" step="0.05" inputmode="decimal" value="${D.targets[cur.code]||''}"></div></div>
  <div id="ver"></div>
  <div class="row"><button class="btn ok" onclick="savePrice()">💾 Enregistrer</button><button class="btn g" onclick="speak()">🔊 Écouter</button></div>
  <div class="row"><button class="btn g" onclick="addList()">➕ Liste</button><button class="btn g" onclick="webSearch()">🌐 Moins cher ailleurs ?</button></div>
  <label class="btn g">🧪 Ingrédients (photo IA)<input type="file" accept="image/*" capture="environment" hidden onchange="ingPhoto(this)"></label>
  <div id="web" class="sm" style="white-space:pre-wrap;margin-top:10px"></div></div>`;analyse()}
function getF(){const g=i=>$(i)?$(i).value:'',r=+g('cu'==='EUR'?'':'')||0;const eur=g('cu')==='EUR',k=eur?D.rate:1;
  return{prix:(+g('pr')||0)*k,ancien_prix:(+g('old')||0)*k,quantite:+g('q')||0,unite:g('u')||'g',promo:g('pm')||'none'}}
function base(f){if(!f.quantite)return null;const n=f.quantite,u=f.unite;return u==='kg'?{n:n*1000,k:'g'}:u==='l'?{n:n*1000,k:'ml'}:{n,k:u==='pc'?'pc':u}}
const lab={g:'/100 g',ml:'/100 ml',pc:'/pièce'};
const u100=(f,b)=>b?(b.k==='pc'?f.prix*PF[f.promo]/b.n:f.prix*PF[f.promo]/b.n*100):null;
function analyse(){if(!cur||!$('ver'))return;const f=getF(),b=base(f),u=u100(f,b),L=[],c=cur.code;
  if(!f.prix){const by={};D.prices.filter(p=>p.code===c).forEach(p=>by[p.store]=p);const k=Object.values(by);let h='';
    if(k.length)h+=`<div class="v info">Prix déjà relevés : ${k.map(p=>`<b>${p.store}</b> ${fmt(p.price)} (${p.date})`).join(' • ')}</div>`;
    if(cur.op&&cur.op.length){const s2=[...cur.op].sort((a,b2)=>a-b2);h+=`<div class="v info">Open Prices (communauté) : médiane ${fmt(s2[Math.floor(s2.length/2)])} CHF sur ${s2.length} relevé(s).</div>`}
    const tx=tix(D.prod[c]||{});if(tx.length)h+=`<div class="v info">🧾 Vu sur tes tickets (nom proche) : ${tx.map(x=>`<span class="chip" onclick="useP(${x.price},'${x.store}')">${x.store} ${fmt(x.price)} · ${esc(x.name)}</span>`).join('')}<div class="sm">Touche pour utiliser ce prix.</div></div>`;
    if(!h)h='<div class="v warn">Aucun prix connu pour ce produit. Entre le prix de l\'étiquette (ou photographie-la) : ton relevé construit l\'historique et déclenche le verdict.</div>';
    $('ver').innerHTML=h;return}
  const hist=D.prices.filter(p=>p.code===c&&p.u100&&b&&p.kind===b.k).sort((a,b2)=>a.date<b2.date?-1:1);
  if(u)L.push(['info',`Prix effectif : <b>${fmt(u)} CHF ${lab[b.k]}</b>${f.promo!=='none'?' (offre incluse)':''}`]);
  if(D.targets[c]&&f.prix<=D.targets[c])L.push(['good','🎯 Sous ton prix cible ('+fmt(D.targets[c])+' CHF) : bon moment pour acheter.']);
  if(f.ancien_prix>f.prix)L.push(['info',`Rabais annoncé : −${Math.round((f.ancien_prix-f.prix)/f.ancien_prix*100)}%`]);
  if(u&&hist.length){const v=hist.map(h=>h.u100).sort((a,b2)=>a-b2),med=v[Math.floor(v.length/2)],d=(u-med)/med;
    if(f.ancien_prix>f.prix&&d>=-.03)L.push(['bad',`⚠️ <b>Promo douteuse</b> : ton prix habituel relevé (~${fmt(med)}) est égal ou plus bas.`]);
    else if(d<-.1)L.push(['good',`✅ <b>Vraie bonne affaire</b> : ${Math.round(-d*100)}% sous ton prix habituel (~${fmt(med)}).`]);
    else L.push(['info',`Prix dans la norme (habituel ~${fmt(med)}, ${hist.length} relevé(s)).`]);
    if(u<=v[0])L.push(['good','🏆 Meilleur prix que tu aies relevé pour ce produit.']);
    const last=hist[hist.length-1];if(last.qty&&last.qty>b.n&&f.prix>=last.price*.98)L.push(['bad',`📉 <b>Réduflation ?</b> contenu passé de ${last.qty} à ${b.n} pour un prix équivalent.`])}
  else L.push(['warn','ℹ️ Pas encore d\'historique : enregistre ce prix pour que le verdict devienne fiable.']);
  if(u){const by={};hist.forEach(h=>{if(h.store!==D.store)by[h.store]=h});const o=Object.values(by).filter(h=>h.u100<u).sort((a,b2)=>a.u100-b2.u100)[0];
    if(o)L.push(['warn',`💡 <b>Moins cher chez ${o.store}</b> : ${fmt(o.u100)} ${lab[b.k]} (−${Math.round((u-o.u100)/u*100)}%, relevé le ${o.date}).`])}
  if(cur.op&&cur.op.length){const s=[...cur.op].sort((a,b2)=>a-b2);L.push(['info',`Open Prices : médiane ${fmt(s[Math.floor(s.length/2)])} CHF (${s.length} relevés de la communauté).`])}
  const tx2=tix(D.prod[c]||{});if(tx2.length)L.push(['info','🧾 Vu sur tes tickets : '+tx2.map(x=>x.store+' '+fmt(x.price)+' ('+x.date+')').join(' • ')]);
  $('ver').innerHTML=L.map(x=>`<div class="v ${x[0]}">${x[1]}</div>`).join('');cur.txt=L.map(x=>x[1].replace(/<[^>]+>/g,'')).join('. ')}
function savePrice(){const f=getF(),b=base(f);if(!f.prix)return toast('Entre un prix');
  D.prices.push({id:Date.now(),code:cur.code,name:(D.prod[cur.code]||{}).name,store:D.store,price:f.prix,old:f.ancien_prix,promo:f.promo,qty:b?b.n:0,kind:b?b.k:'',u100:u100(f,b),date:new Date().toISOString().slice(0,10)});const tg=+($('tg')||{}).value;if(tg>0)D.targets[cur.code]=tg;else delete D.targets[cur.code];save();if(D.targets[cur.code]&&f.prix<=D.targets[cur.code])navigator.vibrate&&navigator.vibrate([80,60,80]);toast(D.targets[cur.code]&&f.prix<=D.targets[cur.code]?'🎯 Prix cible atteint !':'Prix enregistré ✅');analyse()}

/* ===== HISTORIQUE / LISTE / RÉGLAGES ===== */
function spark(v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;
  return `<svg viewBox="0 0 100 30" style="width:100%;height:36px"><polyline fill="none" stroke="#FF6600" stroke-width="2" points="${v.map((x,i)=>`${i*100/(v.length-1)},${28-(x-mn)/r*26}`).join(' ')}"/></svg>`}
let hf={q:'',s:''};
function rHist(){$('app').innerHTML=offH()+`<div class="card"><input id="hq" placeholder="🔍 Rechercher un produit" value="${esc(hf.q)}" oninput="hf.q=this.value;hList()"><div style="margin-top:8px">${['',...Object.keys(ST).slice(0,4)].map(s=>`<span class="chip" style="${hf.s===s?`background:${ST[s]||'#FF6600'};color:#fff`:''}" onclick="hf.s='${s}';rHist()">${s||'Tous'}</span>`).join('')}</div></div><div id="hres"></div>`;hList()}
function hList(){const q=hf.q.toLowerCase().trim(),g={};
  D.prices.filter(p=>(!hf.s||p.store===hf.s)&&(!q||(p.name||'').toLowerCase().includes(q))).forEach(p=>(g[p.code]=g[p.code]||[]).push(p));
  const ks=Object.keys(g).sort((x,y)=>(g[x][0].name||'').localeCompare(g[y][0].name||''));
  $('hres').innerHTML=ks.length?`<div class="sm" style="margin:0 4px 6px">${ks.length} produit(s)</div>`+ks.map(c=>{const a=g[c].sort((x,y)=>x.date<y.date?-1:1);return `<div class="card"><b>${esc(a[0].name)}</b>${a.length>1?(()=>{const z=Math.round((a[a.length-1].price/a[0].price-1)*100);return ` <span class="sm">${z>=0?'📈 +':'📉 '}${z}%</span>`})():''}${D.targets[c]?` <span class="sm">🎯 ${fmt(D.targets[c])}</span>`:''}
  ${spark(a.map(x=>a.every(y=>y.u100)?x.u100:x.price))}${a.slice().reverse().map(x=>`<div class="hd sm" style="padding:4px 0"><span><span class="chip" style="background:${ST[x.store]||'#666'};color:#fff;padding:2px 9px">${x.store}</span> ${x.date}</span><span><b>${fmt(x.price)}</b>${x.old?` <s>${fmt(x.old)}</s>`:''} <a onclick="editP(${x.id})">✏️</a> <a onclick="delP(${x.id})">✕</a></span></div>`).join('')}</div>`}).join(''):'<div class="card sm">Aucun résultat. Scanne un produit, un ticket ou change le filtre.</div>'}
const tok=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(x=>x.length>=4);
function tix(p){const a=tok(p.name);if(!a.length)return[];const by={};
  D.prices.filter(x=>String(x.code).startsWith('n:')).forEach(x=>{const b=tok(x.name),n=a.filter(w=>b.some(y=>y.slice(0,5)===w.slice(0,5))).length;
    if(n>=2||(n>=1&&a.length<=2)){if(!by[x.store]||by[x.store].date<=x.date)by[x.store]=x}});return Object.values(by)}
function useP(p,s){D.store=s;const f=getF();f.prix=p;renderProd(f)}
function delP(id){D.prices=D.prices.filter(p=>p.id!==id);save();hList()}
const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40),J=t=>JSON.parse(t.replace(/```json|```/g,'').trim());
function best(t){const w=String(t).toLowerCase().split(/\s+/).filter(x=>x.length>2)[0];if(!w)return null;
  const sc=n=>{const i=String(n||'').toLowerCase().split(/[^a-zàâçéèêëîïôûù0-9]+/).findIndex(x=>x.startsWith(w));return i<0?9:i===0?0:1},by={};
  D.prices.filter(p=>sc(p.name)<9).sort((a,b)=>a.date<b.date?-1:1).forEach(p=>by[p.store+'|'+p.code]={store:p.store,price:p.price,name:p.name,s:sc(p.name)});
  D.offers.filter(o=>o.prix&&sc(o.nom)<9).forEach(o=>by['o'+o.nom+o.store]={store:o.store+' 🏷️',price:+o.prix,name:o.nom,s:sc(o.nom)});
  return Object.values(by).sort((a,b)=>a.s-b.s||a.price-b.price)[0]||null}
function rList(){const tot=D.list.filter(x=>!x.d).reduce((s,x)=>s+((best(x.t)||{}).price||0),0);
  $('app').innerHTML=`<div class="card"><div class="row"><input id="li" placeholder="Ajouter un article"><button class="btn" style="flex:0 0 70px" onclick="if($('li').value.trim()){D.list.push({id:Date.now(),t:$('li').value.trim(),d:0});save();rList()}">+</button></div>
  ${D.list.map(x=>{const b=best(x.t);return `<div class="hd" style="padding:11px 0;border-bottom:1px solid #94A3B833"><span onclick="tg(${x.id})" style="${x.d?'text-decoration:line-through;color:var(--t2)':''}">${x.d?'✅':'⬜'} ${esc(x.t)}${b?`<div class="sm">💡 ${esc(b.store)} ${fmt(b.price)} · ${esc(b.name||'')}</div>`:''}</span><a onclick="D.list=D.list.filter(y=>y.id!==${x.id});save();rList()">✕</a></div>`}).join('')||'<div class="sm" style="margin-top:12px">Liste vide.</div>'}
  ${tot?`<div class="v info">Total estimé ≈ <b>${fmt(tot)} CHF</b> (articles dont le prix est connu, au moins cher)</div>`:''}
  ${D.list.length?`<button class="btn g" onclick="shareList()">📤 Partager la liste</button>`:''}
  ${D.list.some(x=>x.d)?'<button class="btn g" onclick="D.list=D.list.filter(y=>!y.d);save();rList()">Retirer les articles cochés</button>':''}</div>`}
function shareList(){const t=D.list.filter(x=>!x.d).map(x=>{const b=best(x.t);return '• '+x.t+(b?` (${b.store} ${fmt(b.price)})`:'')}).join('\n');
  if(navigator.share)navigator.share({title:'Liste de courses',text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);toast('Liste copiée')}}
function offH(){if(!D.offers.length)return'';return `<div class="card"><div class="hd"><b>📰 Promos du prospectus</b><a onclick="D.offers=[];save();rHist()">Vider</a></div>${D.offers.slice(0,25).map(o=>`<div class="hd sm" style="padding:5px 0"><span><span class="chip" style="background:${ST[o.store]||'#666'};color:#fff;padding:2px 9px">${o.store}</span> ${esc(o.nom)}</span><b>${fmt(+o.prix||0)}${o.ancien_prix?` <s>${fmt(+o.ancien_prix)}</s>`:''}</b></div>`).join('')}</div>`}
async function docPhoto(inp,k){const f=inp.files[0];if(!f)return;toast(k==='t'?'Lecture du ticket…':'Lecture du prospectus…');
  try{const img=await compress(f);
    if(k==='t'){const j=J(await ai('Ticket de caisse suisse. Réponds UNIQUEMENT en JSON : {"magasin":"Migros|Lidl|Coop|Denner|Autre","date":"AAAA-MM-JJ","total":0,"articles":[{"nom":"","prix":0,"cat":"Fruits-légumes|Frais|Épicerie|Boissons|Hygiène-maison|Autre"}]}. Prix en CHF, un article par ligne, ignore TVA, points et rabais.',{img,max:3000})),st=ST[j.magasin]?j.magasin:'Autre',d=/^\d{4}-\d\d-\d\d$/.test(j.date)?j.date:new Date().toISOString().slice(0,10),A=(j.articles||[]).filter(a=>a.nom&&+a.prix>0);
      if(!A.length){toast('Aucun article lu sur cette photo : reprends le ticket à plat, net, en entier.');return}
      const tot=+j.total||A.reduce((s,a)=>s+ +a.prix,0);
      if(D.rec.some(x=>x.store===st&&x.date===d&&Math.abs(x.total-tot)<0.02)&&!confirm('Ce ticket semble déjà enregistré (même magasin, date et total). L\'ajouter quand même ?'))return;
      const tid=Date.now();A.forEach((a,i)=>{D.prices.push({tid,cat:a.cat||'Autre',id:tid+i+1,code:'n:'+slug(a.nom),name:a.nom,store:st,price:+a.prix,old:0,promo:'none',qty:0,kind:'',u100:null,date:d})});
      D.rec.push({id:tid,store:st,date:d,total:tot,n:A.length});save();toast(`Ticket enregistré : ${A.length} articles ✅`)}
    else{const j=J(await ai('Prospectus de promotions en Suisse. Réponds UNIQUEMENT en JSON : {"magasin":"Migros|Lidl|Coop|Denner|Autre","valable":"dates","offres":[{"nom":"","prix":0,"ancien_prix":0}]}.',{img,max:3000})),st=ST[j.magasin]?j.magasin:'Autre';
      D.offers=(j.offres||[]).map(o=>({...o,store:st})).concat(D.offers).slice(0,80);save();toast(`${(j.offres||[]).length} offres enregistrées 📰 (voir Historique)`)}
  }catch(e){if(typeof e!=='number'&&e!==0)toast('Lecture impossible : refais la photo, plus nette et bien à plat')}}
function rBud(){const m=new Date().toISOString().slice(0,7),R=D.rec.filter(r=>r.date.startsWith(m)),by={},mo={};
  D.rec.forEach(r=>mo[r.date.slice(0,7)]=(mo[r.date.slice(0,7)]||0)+r.total);R.forEach(r=>by[r.store]=(by[r.store]||0)+r.total);
  const tot=R.reduce((s,r)=>s+r.total,0),mx=Math.max(1,...Object.values(by)),pc=D.bud?Math.min(100,tot/D.bud*100):0;
  $('app').innerHTML=`<div class="card"><b>Ce mois-ci</b><div style="font-size:32px;font-weight:900;color:var(--p)">${fmt(tot)} CHF</div><div class="sm">${R.length} ticket(s)</div>
  ${D.bud?`<div class="progress" style="height:10px;border-radius:5px;background:#94A3B833;margin:8px 0"><div style="height:100%;border-radius:5px;width:${pc}%;background:${tot>D.bud?'var(--r)':'var(--g)'}"></div></div><div class="sm">${tot>D.bud?'⚠️ Budget dépassé de '+fmt(tot-D.bud):'Il reste '+fmt(D.bud-tot)} CHF sur ${fmt(D.bud)}</div>`:''}
  ${Object.keys(by).map(s=>`<div class="sm" style="margin-top:8px">${s} — ${fmt(by[s])}</div><div style="height:10px;border-radius:5px;background:${ST[s]};width:${by[s]/mx*100}%"></div>`).join('')}</div>
  ${catH(m)}${inflH()}<div class="card"><b>Budget mensuel (CHF)</b><div class="row"><input id="bd" type="number" inputmode="decimal" value="${D.bud||''}" placeholder="Ex : 800"><button class="btn" style="flex:0 0 90px" onclick="D.bud=+$('bd').value||0;save();rBud()">OK</button></div></div>
  <div class="card"><b>Mois précédents</b>${Object.keys(mo).filter(k=>k!==m).sort().reverse().map(k=>`<div class="hd sm" style="padding:5px 0"><span>${k}</span><b>${fmt(mo[k])} CHF</b></div>`).join('')||'<div class="sm">Rien pour l\'instant.</div>'}</div>
  <div class="card"><b>Tickets</b>${D.rec.slice().reverse().map(x=>`<div class="hd sm" style="padding:6px 0"><span><span class="chip" style="background:${ST[x.store]||'#666'};color:#fff;padding:2px 9px">${x.store}</span> ${x.date} (${x.n} art.)</span><span><b>${fmt(x.total)}</b> <a onclick="editR(${x.id})">✏️</a> <a onclick="D.rec=D.rec.filter(y=>y.id!==${x.id});D.prices=D.prices.filter(p=>p.tid!==${x.id});save();rBud()">✕</a></span></div>`).join('')||'<div class="sm">Aucun ticket. Scanne-en un depuis l\'onglet Scanner (🧾 Ticket).</div>'}</div>`}
function tg(id){const x=D.list.find(y=>y.id===id);x.d=!x.d;save();rList()}
function rSet(){$('app').innerHTML=`<div class="card"><b>Clé IA (Anthropic)</b><div class="sm">Pour lire les étiquettes et chercher les prix en ligne. Reste sur cet iPhone.</div>
  <input id="k" type="password" placeholder="sk-ant-…" value="${esc(D.key)}" style="margin-top:8px"><button class="btn" onclick="D.key=$('k').value.trim();save();toast('Clé enregistrée ✅')">Enregistrer</button></div>
  <div class="card"><b>Mes allergies</b><div style="margin-top:6px">${ALG.map(a=>`<span class="chip" style="${D.alg.includes(a[1])?'background:#DC2626;color:#fff':''}" onclick="D.alg=D.alg.includes('${a[1]}')?D.alg.filter(z=>z!=='${a[1]}'):[...D.alg,'${a[1]}'];save();rSet()">${a[0]}</span>`).join('')}</div></div>
  <div class="card"><b>Prix automatiques au scan</b><div class="sm" style="margin:4px 0 8px">Cherche le prix en ligne à chaque scan (utilise ta clé IA, quelques centimes par scan).</div><span class="chip" style="${D.auto!==false?'background:#16A34A;color:#fff':''}" onclick="D.auto=D.auto===false;save();rSet()">${D.auto!==false?'Activé':'Désactivé'}</span></div>
  <div class="card"><b>Taux € → CHF : ${D.rate}</b><button class="btn g" onclick="rate()">Mettre à jour (taux du jour)</button></div>
  ${cardsH()}<div class="card"><button class="btn g" onclick="expCsv()">📊 Exporter en tableau (CSV)</button><button class="btn g" onclick="exp()">💾 Sauvegarder mes données</button><label class="btn g">📥 Restaurer une sauvegarde<input type="file" accept="application/json,.json" hidden onchange="imp(this)"></label><button class="btn d" onclick="if(confirm('Tout effacer ?')){localStorage.removeItem(K);location.reload()}">Réinitialiser</button></div>`}
async function rate(){try{const d=await(await fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF')).json();D.rate=d.rates.CHF;save();rSet();toast('Taux mis à jour')}catch(e){toast('Taux indisponible')}}
function imp(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!Array.isArray(j.prices))throw 0;if(!confirm('Remplacer tes données actuelles par cette sauvegarde ?'))return;const k=D.key;D=Object.assign({prices:[],prod:{},list:[],rec:[],offers:[],targets:{},alg:[],rate:0.94,store:'Migros',bud:0},j,{key:k});save();toast('Sauvegarde restaurée ✅');rSet()}catch(e){toast('Fichier de sauvegarde invalide')}};rd.readAsText(f)}
function editP(id){const p=D.prices.find(x=>x.id===id);if(!p)return;const n=prompt('Nom du produit',p.name||'');if(n===null)return;const v=prompt('Prix (CHF)',p.price);if(v===null)return;const d=prompt('Date (AAAA-MM-JJ)',p.date);if(d===null)return;
  p.name=n.trim()||p.name;p.price=+String(v).replace(',','.')||p.price;if(/^\d{4}-\d\d-\d\d$/.test(d))p.date=d;save();hList()}
function editR(id){const x=D.rec.find(y=>y.id===id);if(!x)return;const t=prompt('Total du ticket (CHF)',x.total);if(t===null)return;const d=prompt('Date (AAAA-MM-JJ)',x.date);if(d===null)return;
  x.total=+String(t).replace(',','.')||x.total;if(/^\d{4}-\d\d-\d\d$/.test(d)){x.date=d;D.prices.forEach(p=>{if(p.tid===id)p.date=d})}save();rBud()}
function catH(m){const c={};D.prices.filter(p=>p.tid&&p.cat&&p.date.startsWith(m)).forEach(p=>c[p.cat]=(c[p.cat]||0)+p.price);const k=Object.keys(c).sort((a,b)=>c[b]-c[a]);if(!k.length)return'';
  return `<div class="card"><b>Par catégorie (ce mois)</b>${k.map(x=>`<div class="sm" style="margin-top:8px">${esc(x)} — ${fmt(c[x])}</div><div style="height:10px;border-radius:5px;background:var(--p);width:${c[x]/c[k[0]]*100}%"></div>`).join('')}</div>`}
function inflH(){const g={},v=[];D.prices.forEach(p=>(g[p.code]=g[p.code]||[]).push(p));
  Object.values(g).forEach(a=>{a.sort((x,y)=>x.date<y.date?-1:1);if(a.length>1&&a[0].price>0&&a[0].date!==a[a.length-1].date)v.push((a[a.length-1].price/a[0].price-1)*100)});if(!v.length)return'';
  const m=v.reduce((s,x)=>s+x,0)/v.length;return `<div class="card"><b>Inflation perso</b><div style="font-size:26px;font-weight:900;color:${m>0?'var(--r)':'var(--g)'}">${m>0?'+':''}${m.toFixed(1)}%</div><div class="sm">Variation moyenne du prix de ${v.length} produit(s) achetés plusieurs fois.</div></div>`}
async function ingPhoto(inp){const f=inp.files[0];if(!f)return;$('web').textContent='Lecture des ingrédients…';

  navigator.geolocation.getCurrentPosition(async p=>{try{const q=`[out:json][timeout:10];nwr(around:150,${p.coords.latitude},${p.coords.longitude})[shop];out tags 30;`;
    const d=await(await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))).json();const t=d.elements.map(e=>((e.tags.brand||'')+' '+(e.tags.name||'')).toLowerCase()).join(' ');
    const m=Object.keys(ST).find(z=>z!=='Autre'&&t.includes(z.toLowerCase()));if(m){D.store=m;save();renderProd(getF());toast('📍 '+m+' détecté')}else toast('Aucune enseigne connue à moins de 150 m')}catch(e){toast('Détection impossible')}},()=>toast('Position refusée'),{timeout:10000})}
function cardsH(){return `<div class="card"><b>💳 Mes cartes de fidélité</b>${(D.cards||[]).map(c=>`<div class="hd" style="padding:9px 0"><b>${esc(c.name)}</b><span><a onclick="showCard(${c.id})">Afficher</a> <a onclick="D.cards=D.cards.filter(y=>y.id!==${c.id});save();rSet()">✕</a></span></div>`).join('')}<label class="btn g">+ Ajouter une carte (photo)<input type="file" accept="image/*" capture="environment" hidden onchange="addCard(this)"></label></div>`}
async function addCard(inp){const f=inp.files[0];if(!f)return;const n=prompt('Nom de la carte (ex : Cumulus)');if(!n)return;try{D.cards=D.cards||[];D.cards.push({id:Date.now(),name:n,img:'data:image/jpeg;base64,'+await compress(f)});save();rSet()}catch(e){toast('Photo illisible')}}

function expCsv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['date','magasin','produit','prix','ancien_prix','categorie'],...D.prices.map(p=>[p.date,p.store,p.name,p.price,p.old||'',p.cat||''])];
